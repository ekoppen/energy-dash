# docker-compose.yml — Energie Dashboard
#
# Twee services:
#   backend  — FastAPI proxy naar Home Assistant. Houdt het HA-token serverside,
#              rekent tarieven/advies, en levert schone JSON aan de frontend.
#   frontend — de webapp (Vite build), geserveerd door nginx. De browser praat
#              met de backend (/api) en rechtstreeks met Apenkaas (inloggen,
#              instellingen, CSV); nooit direct met HA.
#
# HA-tokens staan per gebruiker in Apenkaas; de server-key komt uit .env /
# Coolify secrets (deployment). Zie .env.example.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: energie-dashboard-backend:latest
    restart: unless-stopped
    environment:
      # Uit .env / Coolify secrets — niet hardcoden.
      APENKAAS_URL: ${APENKAAS_URL}
      APENKAAS_TENANT_ID: ${APENKAAS_TENANT_ID}
      APENKAAS_SERVER_KEY: ${APENKAAS_SERVER_KEY}
      APENKAAS_KOPPELING_COLLECTION_ID: ${APENKAAS_KOPPELING_COLLECTION_ID}
      HA_PRIVE_TOEGESTAAN: ${HA_PRIVE_TOEGESTAAN:-}
      # Alleen de frontend-origin mag de backend aanroepen.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - energie

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # De frontend praat met de backend via dit pad. In productie proxyt
        # nginx /api door naar de backend-service (zie nginx.conf).
        VITE_API_BASE: /api
        VITE_APENKAAS_URL: ${VITE_APENKAAS_URL}
        VITE_APENKAAS_TENANT_ID: ${VITE_APENKAAS_TENANT_ID}
        VITE_APENKAAS_INSTELLINGEN_COLLECTION_ID: ${VITE_APENKAAS_INSTELLINGEN_COLLECTION_ID}
        VITE_APENKAAS_UURDATA_BUCKET_ID: ${VITE_APENKAAS_UURDATA_BUCKET_ID}
    image: energie-dashboard-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Host-poort 8080 → nginx in de container. Pas aan of laat Traefik/Coolify
      # dit afhandelen bij deployment.
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - energie

networks:
  energie:
    driver: bridge
