# nginx.conf — serveert de SPA en proxyt /api naar de backend-service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API-calls doorsturen naar de backend-container (compose-servicenaam).
    location /api/ {
        # strip /api en stuur door naar de backend
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # SPA-fallback: alle andere routes naar index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statische assets cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
